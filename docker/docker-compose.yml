# LabelBridge all-in-one server - Docker Compose
#
#   1. copy this file to your NAS/server
#   2. create a .env next to it with:   LB_ADMIN_SECRET=some-long-random-string
#   3. docker compose up -d --build
#
# The server speaks plain HTTP on 8080 (web UI + API). Put it behind Caddy /
# Traefik / nginx / Cloudflare Tunnel for HTTPS when used over the internet.
# LB_ADMIN_SECRET is the initial admin password on first setup.

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: labelbridge/server:1.0.0
    container_name: labelbridge-server
    restart: unless-stopped

    ports:
      # bind on all interfaces; restrict to a proxy-only network if preferred
      - "8080:8080"

    environment:
      LB_LISTEN: "http://+:8080/"
      LB_DATA: "/data"
      LB_ADMIN_SECRET: "${LB_ADMIN_SECRET:?create a .env file with LB_ADMIN_SECRET=...}"
      LB_REPO: "${LB_REPO:-bogdan-ralakde/OnlinePrinter}"
      LB_VERSION: "${LB_VERSION:-1.0.0}"
      LB_RETENTION_HOURS: "${LB_RETENTION_HOURS:-168}"
      LB_MAX_MB: "${LB_MAX_MB:-128}"
      LB_MAX_JOBS: "${LB_MAX_JOBS:-2000}"

    volumes:
      - labelbridge-data:/data

    healthcheck:
      test: ["CMD", "dotnet", "/app/LabelBridge.Relay.dll", "--health-check", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  labelbridge-data:
